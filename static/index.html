<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الديون</title>
<style>
:root {
  --bg: #050505;
  --card: rgba(255,255,255,0.04);
  --card-strong: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.10);
  --border-soft: rgba(255,255,255,0.05);
  --text: #f8fafc;
  --muted: #94a3b8;
  --faint: #64748b;
  --accent: #d97706;
  --accent-text: #fbbf24;
  --accent-soft: rgba(245,158,11,0.10);
  --accent-border: rgba(245,158,11,0.25);
  --good: #34d399;
  --bad: #fda4af;
  --bad-soft: rgba(244,63,94,0.10);
}
html.light {
  --bg: #f4f5f7;
  --card: rgba(15,23,42,0.03);
  --card-strong: rgba(15,23,42,0.06);
  --border: rgba(15,23,42,0.10);
  --border-soft: rgba(15,23,42,0.06);
  --text: #0f172a;
  --muted: #475569;
  --faint: #78716c;
  --accent-text: #b45309;
  --good: #047857;
  --bad: #be123c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  transition: background-color .25s, color .25s;
}
button, input { font: inherit; color: inherit; }
.glass { background: var(--card); border: 1px solid var(--border); border-radius: 18px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

/* ---------- layout ---------- */
.app { height: 100%; display: flex; flex-direction: column; max-width: 1400px; margin: 0 auto; padding: 16px; gap: 16px; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); display: grid; place-items: center;
  color: #0f172a; font-size: 20px; font-weight: 700; flex-shrink: 0; }
header h1 { margin: 0; font-size: 18px; }
header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
.icon-btn { background: var(--card-strong); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.icon-btn:hover { border-color: var(--accent-border); color: var(--accent-text); }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }

/* ---------- chat ---------- */
.chat { display: flex; flex-direction: column; min-height: 0; }
.section-title { padding: 14px 18px; border-bottom: 1px solid var(--border-soft); font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 8px; }
.section-title small { color: var(--faint); font-weight: 400; }
.messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.7; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-start; background: var(--accent); color: #0f172a; border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-end; background: var(--card-strong); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.error { border-color: rgba(244,63,94,0.3); background: var(--bad-soft); }
.agent-wrap { align-self: flex-end; max-width: 85%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.agent-wrap .msg { max-width: 100%; }
.why-btn { background: none; border: none; color: var(--accent-text); font-size: 12px; cursor: pointer; padding: 2px 4px; }
.why-btn:hover { text-decoration: underline; }
.tools { width: 100%; display: none; flex-direction: column; gap: 6px; }
.tools.open { display: flex; }
.tool { background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: 12px; padding: 8px 12px; font-size: 12px; }
.tool .head { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.tool .ok { color: var(--good); } .tool .fail { color: var(--bad); }
.tool code { display: block; direction: ltr; text-align: left; color: var(--muted); font-size: 11px; margin-top: 4px;
  white-space: pre-wrap; word-break: break-all; font-family: Consolas, monospace; }
.thinking { align-self: flex-end; color: var(--muted); font-size: 13px; padding: 8px 4px; }
.thinking span { animation: blink 1.4s infinite both; }
.thinking span:nth-child(2) { animation-delay: .2s; } .thinking span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.welcome { margin: auto; text-align: center; color: var(--muted); font-size: 14px; max-width: 360px; line-height: 1.8; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 10px; }
.chip { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 12px;
  cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--accent-text); border-color: var(--accent-border); }
form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border-soft); }
form input { flex: 1; min-width: 0; background: var(--card-strong); border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 14px; font-size: 15px; outline: none; }
form input:focus { border-color: var(--accent-border); }
form button { background: var(--accent); color: #0f172a; border: none; border-radius: 14px; padding: 0 20px; font-weight: 700; cursor: pointer; }
form button:disabled { opacity: .5; cursor: wait; }

/* ---------- debtors ---------- */
.debtors { display: flex; flex-direction: column; min-height: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 18px; }
.stat { background: var(--card); border: 1px solid var(--border-soft); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.stat.accent b { color: var(--accent-text); }
.table-wrap { flex: 1; overflow-y: auto; padding: 0 18px 18px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: right; font-size: 11px; color: var(--faint); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); }
td { padding: 10px 6px; border-bottom: 1px solid var(--border-soft); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.date { color: var(--faint); font-size: 12px; white-space: nowrap; }
.credit { color: var(--good); }
.zero { color: var(--faint); }
tr.flash td { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.empty { text-align: center; color: var(--faint); padding: 30px 0; font-size: 13px; }

/* ---------- mobile ---------- */
@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; padding: 10px; gap: 10px; }
  main { grid-template-columns: 1fr; }
  .chat { height: 72vh; }
  .debtors { min-height: 300px; }
  header p { display: none; }
  .msg, .agent-wrap { max-width: 92%; }
}
</style>
</head>
<body>
<div class="app">
  <header class="glass">
    <div class="logo">د</div>
    <div>
      <h1>دفتر الديون</h1>
      <p>اكتب مثل ما تحچي: "سجل على ابو علي 25 الف"</p>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="newChat" title="محادثة جديدة (البيانات تبقى)">محادثة جديدة</button>
    <button class="icon-btn" id="theme" title="فاتح / غامق">☀︎</button>
  </header>

  <main>
    <section class="chat glass">
      <div class="section-title">المحادثة</div>
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          هلا بيك 👋<br>
          گلي شنو أسجل أو شنو تريد تعرف عن ديون الزبائن.
        </div>
      </div>
      <div class="chips" id="chips">
        <button class="chip">سجل على ابو علي 25 الف</button>
        <button class="chip">ابو علي دفع عشرة</button>
        <button class="chip">شكد باقي على ابو علي؟</button>
        <button class="chip">منو أكثر واحد عليه دين؟</button>
        <button class="chip">شطب آخر وحدة</button>
      </div>
      <form id="form" autocomplete="off">
        <input id="input" placeholder="اكتب رسالتك هنا..." maxlength="2000">
        <button id="send" type="submit">إرسال</button>
      </form>
    </section>

    <section class="debtors glass">
      <div class="section-title">المدينين <small id="updated"></small></div>
      <div class="stats">
        <div class="stat accent"><span>مجموع الديون بالدينار</span><b id="totalIqd">0</b></div>
        <div class="stat accent"><span>مجموع الديون بالدولار</span><b id="totalUsd">0</b></div>
        <div class="stat"><span>عدد الزبائن</span><b id="count">0</b></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>الاسم</th><th>دينار</th><th>دولار</th><th>آخر حركة</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty">ما كو ديون بعد.</div>
      </div>
    </section>
  </main>
</div>

<script>
/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : 'id_' + Date.now() + Math.random().toString(36).slice(2));

/* ---------- theme (same idea as the engineering office app) ---------- */
function applyTheme(mode) {
  document.documentElement.classList.toggle('light', mode === 'light');
  $('theme').textContent = mode === 'light' ? '☾' : '☀︎';
  store.set('debt_theme', mode);
}
applyTheme(store.get('debt_theme') || 'dark');
$('theme').onclick = () => applyTheme(document.documentElement.classList.contains('light') ? 'dark' : 'light');

/* ---------- chat ---------- */
let sessionId = newId();
let busy = false;

const TOOL_LABELS = {
  find_customer: 'دوّر على زبون',
  add_customer: 'أضاف زبون',
  record_debt: 'سجّل دين',
  record_payment: 'سجّل تسديد',
  get_balance: 'شاف الرصيد',
  get_history: 'شاف آخر القيود',
  list_debtors: 'جاب قائمة المدينين',
  undo_last: 'لغى آخر قيد',
};

function scrollDown() { const m = $('messages'); m.scrollTop = m.scrollHeight; }

function addUser(text) {
  $('welcome')?.remove();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  $('messages').appendChild(div);
  scrollDown();
}

function toolHtml(call) {
  const ok = call.result && call.result.ok;
  const label = TOOL_LABELS[call.tool] || call.tool;
  return `<div class="tool">
    <div class="head"><span class="${ok ? 'ok' : 'fail'}">${ok ? '✓' : '✗'}</span>${esc(label)}
      <span style="color:var(--faint);font-weight:400">(${esc(call.tool)})</span></div>
    <code>← ${esc(JSON.stringify(call.input))}</code>
    <code>→ ${esc(JSON.stringify(call.result))}</code>
  </div>`;
}

function addAgent(text, toolCalls, isError) {
  const wrap = document.createElement('div');
  wrap.className = 'agent-wrap';
  wrap.innerHTML = `<div class="msg agent${isError ? ' error' : ''}">${esc(text)}</div>`;
  if (toolCalls && toolCalls.length) {
    const btn = document.createElement('button');
    btn.className = 'why-btn';
    btn.textContent = `شنو سوّى الوكيل؟ (${toolCalls.length})`;
    const list = document.createElement('div');
    list.className = 'tools';
    list.innerHTML = toolCalls.map(toolHtml).join('');
    btn.onclick = () => { list.classList.toggle('open'); if (list.classList.contains('open')) scrollDown(); };
    wrap.append(btn, list);
  }
  $('messages').appendChild(wrap);
  scrollDown();
}

function setBusy(on) {
  busy = on;
  $('send').disabled = on;
  $('input').disabled = on;
  if (on) {
    const t = document.createElement('div');
    t.className = 'thinking'; t.id = 'thinking';
    t.innerHTML = 'دا أفكر<span>.</span><span>.</span><span>.</span>';
    $('messages').appendChild(t);
    scrollDown();
  } else {
    $('thinking')?.remove();
    $('input').focus();
  }
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  addUser(text);
  $('input').value = '';
  setBusy(true);
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message: text}),
    });
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    setBusy(false);
    addAgent(data.reply, data.tool_calls);
    const wrote = (data.tool_calls || []).some(c => c.result && c.result.ok &&
      ['record_debt', 'record_payment', 'add_customer', 'undo_last'].includes(c.tool));
    loadDebtors(wrote);
  } catch (e) {
    setBusy(false);
    addAgent('ما گدرت أوصل للسيرفر. تأكد إن البرنامج بعده شغال بالطرفية.', [], true);
  }
}

$('form').onsubmit = e => { e.preventDefault(); send($('input').value); };
$('chips').onclick = e => { if (e.target.classList.contains('chip')) send(e.target.textContent); };
$('newChat').onclick = () => {
  if (busy) return;
  sessionId = newId();
  $('messages').innerHTML = '<div class="welcome" id="welcome">بدينا محادثة جديدة. البيانات محفوظة مثل ما هي.</div>';
};

/* ---------- debtors table ---------- */
let lastSnapshot = {};

function balanceCell(v) {
  if (!v) return '<td class="num zero">—</td>';
  if (v < 0) return `<td class="num credit" title="إله عندك">إله ${fmt(-v)}</td>`;
  return `<td class="num">${fmt(v)}</td>`;
}

function shortDate(s) {
  if (!s) return '—';
  const [d, t] = s.split(' ');
  const today = new Date().toISOString().slice(0, 10);
  return d === today ? 'اليوم ' + (t || '').slice(0, 5) : d;
}

async function loadDebtors(flash) {
  try {
    const res = await fetch('/debtors');
    const data = await res.json();
    const rows = data.debtors || [];
    $('totalIqd').textContent = fmt(data.totals.IQD);
    $('totalUsd').textContent = fmt(data.totals.USD);
    $('count').textContent = fmt(rows.length);
    $('empty').style.display = rows.length ? 'none' : 'block';
    const snapshot = {};
    $('rows').innerHTML = rows.map(r => {
      const key = r.balances.IQD + '|' + r.balances.USD;
      snapshot[r.id] = key;
      const changed = flash && lastSnapshot[r.id] !== key;
      return `<tr class="${changed ? 'flash' : ''}"><td>${esc(r.name)}</td>${balanceCell(r.balances.IQD)}${balanceCell(r.balances.USD)}<td class="date">${esc(shortDate(r.last_activity))}</td></tr>`;
    }).join('');
    lastSnapshot = snapshot;
    $('updated').textContent = '· تحدث ' + new Date().toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
  } catch (e) {
    $('updated').textContent = '· ما گدرت أحدّث';
  }
}

loadDebtors(false);
$('input').focus();
</script>
</body>
</html>
